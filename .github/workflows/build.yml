name: EvolutionX a3xelte build and release

on:
  workflow_dispatch:
  push:
    branches:
      - vic

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    env:
      ROM_DEVICE: a3xelte
      ROM_LUNCH: evolution_a3xelte-userdebug
      EVOX_BRANCH: vic
      CCACHE_SIZE: ${{ secrets.CCACHE_SIZE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Skip dependency install (already installed)
      run: echo "Dependencies already installed on runner"

    - name: Init repo
      run: |
        mkdir evox && cd evox
        repo init -u https://github.com/Evolution-X/manifest -b ${EVOX_BRANCH}

    - name: Add local manifests (device/kernel/vendor/hardware)
      run: |
        cd evox
        mkdir -p .repo/local_manifests
        cat > .repo/local_manifests/a3xelte.xml <<'EOF'
        <manifest>
          <project name="a3xelte/device"
                   path="device/samsung/a3xelte"
                   remote="github"
                   revision="master" />
          <project name="a3xelte/kernel"
                   path="kernel/samsung/universal7580"
                   remote="github"
                   revision="master" />
          <project name="a3xelte/vendor"
                   path="vendor/samsung/a3xelte"
                   remote="github"
                   revision="master" />
          <project name="a3xelte/hardware"
                   path="hardware/a3xelte"
                   remote="github"
                   revision="master" />
        </manifest>
        EOF
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)

    - name: Setup ccache
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        if [ -n "${CCACHE_SIZE}" ]; then
          ccache -M ${CCACHE_SIZE}
        else
          ccache -M 10G
        fi

    - name: Build ROM
      run: |
        cd evox
        source build/envsetup.sh
        lunch ${ROM_LUNCH}
        m evolution -j$(nproc --all)

    - name: Find build artifacts
      id: findzip
      run: |
        ZIP_PATH=$(ls -1 evox/out/target/product/${ROM_DEVICE}/*.zip | tail -n1)
        echo "zip=${ZIP_PATH}" >> $GITHUB_OUTPUT
        echo "Found: ${ZIP_PATH}"

    - name: Create release and upload zip
      uses: softprops/action-gh-release@v1
      with:
        tag_name: evox-${{ env.ROM_DEVICE }}-${{ github.run_number }}
        name: "EvolutionX ${{ env.ROM_DEVICE }} build #${{ github.run_number }}"
        draft: false
        prerelease: false
        files: ${{ steps.findzip.outputs.zip }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

